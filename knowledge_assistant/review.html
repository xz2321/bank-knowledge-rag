<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库文档审核工作台</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:820px;margin:36px auto;padding:0 18px;background:#f6f7f9;color:#202124}section{background:#fff;border:1px solid #e1e4e8;border-radius:8px;padding:20px;margin:16px 0}h1{font-size:24px}h2{font-size:18px}button{padding:9px 16px;background:#1769e0;color:#fff;border:0;border-radius:5px;cursor:pointer;margin:4px 8px 4px 0}.secondary{background:#fff;color:#1769e0;border:1px solid #1769e0}button:disabled{opacity:.6;cursor:wait}input{margin:12px 0}.status{white-space:pre-wrap;line-height:1.6;color:#344054}a{color:#1769e0}</style>
<h1>知识库文档审核工作台</h1><p>上传 PDF 并解析后，可以直接入库，也可以先下载 Markdown 人工校对，再上传审核后的版本。</p><p><a href="/jobs">查看历史任务 / 重新下载已解析的文件 →</a></p>
<section><h2>1. 上传 PDF 并处理</h2><input id="pdf" type="file" accept="application/pdf"><br><button onclick="processPdf()">开始处理</button><div id="p" class="status"></div></section>
<section><h2>2. 上传人工审核后的 Markdown</h2><input id="md" type="file" accept=".md,text/markdown"><br><button onclick="ingest()">审核通过，更新知识库</button><div id="i" class="status"></div></section>
<script>async function readResponse(r){const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw new Error(`服务器返回非 JSON 响应（HTTP ${r.status}）：${body.slice(0,1200)||'(空响应)'}`)}if(!r.ok)throw new Error(data.detail||data.message||`HTTP ${r.status}`);return data}</script>
<script>async function processPdf(){const f=document.getElementById('pdf').files[0],s=document.getElementById('p');if(!f){s.textContent='请选择 PDF';return}s.textContent='正在处理，OCR/图片理解可能需要一些时间…';const d=new FormData();d.append('file',f);try{const r=await fetch('/process',{method:'POST',body:d}),x=await readResponse(r);s.innerHTML='处理完成，任务号 <code>'+x.job_id+'</code>，提取图片 '+x.images_extracted+' 张（视觉模型：'+(x.vision_enabled?'已配置':'未配置')+'），文件大小 '+Number(x.size_bytes).toLocaleString()+' 字节：<br><button onclick="ingestProcessed(\''+encodeURIComponent(x.job_id)+'\',\''+encodeURIComponent(x.filename)+'\',this)">直接入库</button><button class="secondary" onclick="this.nextElementSibling.click()">先下载人工校对</button><a hidden download href="'+x.download+'"></a>　<a target="_blank" href="'+x.view+'">直接查看本次内容</a><div class="status" id="direct-ingest-status"></div>'}catch(e){s.textContent='处理失败：'+e.message}}</script>
<script>async function ingestProcessed(job,file,button){const s=document.getElementById('direct-ingest-status');button.disabled=true;s.textContent='正在将解析结果写入知识库并重建索引…';try{const r=await fetch('/ingest-job/'+job+'/'+file,{method:'POST'}),x=await readResponse(r);s.textContent=x.message}catch(e){s.textContent='直接入库失败：'+e.message}finally{button.disabled=false}}</script>
<script>async function ingest(){const f=document.getElementById('md').files[0],s=document.getElementById('i');if(!f){s.textContent='请选择审核后的 Markdown';return}s.textContent='正在更新索引…';const d=new FormData();d.append('file',f);try{const r=await fetch('/ingest',{method:'POST',body:d}),x=await readResponse(r);s.textContent=x.message}catch(e){s.textContent='入库失败：'+e.message}}</script></html>
